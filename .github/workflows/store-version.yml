name: Store version

# WHAT THIS ASKS, and why it is not a test. Every other check in this family
# reads the tree. This one reads the Microsoft Store and compares it with what
# the tree SAYS about it: the version in this repository, the CHANGELOG
# sentence, and the `shipped:` field in z80cpmw/FEATURE_PARITY.md that the
# whole parity column is scored against.
#
# It exists because those claims were wrong. On 2026-09-06 z80cpmw's changelog
# said the Microsoft Store served 1.0.23; DisplayCatalog said 1.0.25, two
# releases later, and a parity re-read had already been done against the wrong
# commit on the strength of that sentence. Nothing in the tree could have caught
# it, because the tree was the thing that was wrong.
#
# SCHEDULE, not just push. A store moves without anybody committing here - that
# is the entire failure mode - so the daily run is the point and the push
# trigger is a convenience for the files that carry the claims.
#
# EXIT CODES, and the one judgement call in this file:
#   0  measured, and nothing here contradicts it            -> green
#   1  something records a shipped state the store denies   -> RED, fix the claim
#   2  could not verify (network, rate limit, page shape)   -> green with a
#      warning annotation and a NOT VERIFIED line in the job summary.
#
# Exit 2 does not fail the job, and that is deliberate rather than lazy. These
# reach third parties that go down, rate-limit and change page shapes; a build
# that goes red every time one of them hiccups gets ignored, and an ignored
# gate is worse than none. It does not report success either - the annotation
# and the summary both say NOT VERIFIED, so a run that never manages to measure
# is visible rather than silently green. Exit 2 is retried once first, because
# most of them are transient.

on:
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/check-store-version.sh'
      - '.github/workflows/store-version.yml'
      - 'CHANGELOG.md'
      - 'z80cpmw/Version.h'
      - 'FEATURE_PARITY.md'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out z80cpmw
        uses: actions/checkout@v7
        with:
          path: z80cpmw

      - name: Measure the Microsoft Store
        run: |
          set +e
          for attempt in 1 2; do
            sh z80cpmw/tools/check-store-version.sh > out.txt 2>&1
            rc=$?
            [ "$rc" != 2 ] && break
            [ "$attempt" = 1 ] && { echo "could not verify; retrying once"; sleep 20; }
          done
          cat out.txt
          {
            echo '### Store version'
            echo
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "measured, and nothing here contradicts it" ;;
            2) echo "NOT VERIFIED - the Microsoft Store could not be measured" >> "$GITHUB_STEP_SUMMARY"
               echo "::warning::NOT VERIFIED: could not measure the Microsoft Store (exit 2)" ;;
            *) echo "::error::a recorded shipped state contradicts the Microsoft Store"
               exit 1 ;;
          esac
